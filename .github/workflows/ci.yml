name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DairyDNA.sln

      - name: Build
        run: dotnet build DairyDNA.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DairyDNA.sln --no-build --configuration Release --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  demo-hardening-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan + health-check test presence
        shell: pwsh
        run: ./scripts/ci-checks.ps1 -SkipTests
